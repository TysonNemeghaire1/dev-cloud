name: FinSecure — CI/CD Pipeline (DevSecOps)

on:
  push:
    branches: [main]
    paths:
      - 'tp4-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'tp4-app/**'

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  REGION: europe-west9
  REGISTRY: europe-west9-docker.pkg.dev
  REPOSITORY: tp4-app-registry
  IMAGE_NAME: finsecure-api
  CLUSTER_NAME: tp3-cluster

jobs:
  # ============================================================
  # Job 1 : Tests unitaires
  # ============================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tp4-app/package-lock.json

      - name: Installer les dépendances
        run: cd tp4-app && npm ci

      - name: Exécuter les tests
        run: cd tp4-app && npm test

  # ============================================================
  # Job 2 : Build & Push de l'image Docker vers Artifact Registry
  # ============================================================
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # Authentification GCP via Workload Identity Federation (sans clé JSON)
      - name: Authentification GCP (Workload Identity — sans clé JSON)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "finsecure-github-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Construire et pousser l'image Docker
        id: image-tag
        run: |
          TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "${TAG}" ./tp4-app
          docker push "${TAG}"
          # Tag latest aussi
          docker tag "${TAG}" "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Job 3 : Scan de vulnérabilités Trivy (bloque si CRITICAL/HIGH)
  # S'exécute après le build, AVANT le déploiement
  # ============================================================
  security-scan:
    name: Scan Vulnérabilités
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Installer Trivy (scanner open-source CVE)
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Authentification GCP (Workload Identity — sans clé JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Configurer Docker pour Artifact Registry
        run: gcloud auth configure-docker europe-west9-docker.pkg.dev --quiet

      - name: Scanner l'image pour les vulnérabilités critiques
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Image à scanner : ${IMAGE_TAG}"
          trivy image \
            --exit-code 1 \
            --severity "CRITICAL,HIGH" \
            --ignore-unfixed \
            --format table \
            "${IMAGE_TAG}"

      - name: Générer un rapport SARIF (intégration GitHub Security)
        if: always()
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            "${IMAGE_TAG}"

      - name: Uploader le rapport dans GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ============================================================
  # Job 4 : Déploiement sur GKE (après scan validé)
  # ============================================================
  deploy:
    name: Deploy GKE
    runs-on: ubuntu-latest
    needs: [build-push, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authentification GCP (Workload Identity — sans clé JSON)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SA }}

      - name: Configurer kubectl pour GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - name: Déployer sur GKE
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" tp4-app/k8s/deployment.yaml
          kubectl apply -f tp4-app/k8s/deployment.yaml
          kubectl rollout status deployment/finsecure-app --timeout=300s

      - name: Vérifier le déploiement
        run: |
          kubectl get pods -l app=finsecure-app
          kubectl get service finsecure-app-service
