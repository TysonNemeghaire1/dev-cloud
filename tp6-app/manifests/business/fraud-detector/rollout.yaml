apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fraud-detector
  namespace: fraudguard
spec:
  replicas: 4
  strategy:
    canary:
      # Service qui pointe TOUJOURS vers la version stable
      stableService: fraud-detector-stable
      # Service qui pointe vers la nouvelle version (Canary)
      canaryService: fraud-detector-canary
      steps:
        - setWeight: 20    # 20% du trafic vers Canary
        - pause: { duration: 2m }   # Observer pendant 2 minutes
        - analysis:
            templates:
              - templateName: fraud-detector-success-rate
        - setWeight: 40
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: fraud-detector-success-rate
        - setWeight: 80
        - pause: { duration: 1m }
        - setWeight: 100   # Promotion complète
  selector:
    matchLabels:
      app: fraud-detector
  template:
    metadata:
      labels:
        app: fraud-detector
    spec:
      containers:
        - name: fraud-detector
          image: europe-west9-docker.pkg.dev/ynov-cloud-tyson/tp2-registry/fraudguard-streams:v2
          ports:
            - name: metrics
              containerPort: 9102
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "fraudguard-kafka-kafka-bootstrap.fraudguard.svc.cluster.local:9092"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
