apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-detector
  namespace: fraudguard
spec:
  mode: one
  selector:
    namespaces:
      - fraudguard
    labelSelectors:
      app: fraud-detector
  stressors:
    cpu:
      workers: 2
      load: 95   # 95% de CPU consommé par le stress
  duration: '5m'
